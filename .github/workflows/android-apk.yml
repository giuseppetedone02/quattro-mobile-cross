# APK universale Android, profilo "sideload".
#
# Manuale (workflow_dispatch) e automatico su tag "v*". Non gira su ogni push:
# una build EAS consuma minuti del piano e non serve a ogni commit.
#
# ATTENZIONE ALLA KEYSTORE DI RELEASE.
# Fuori dal Play Store la keystore E' l'identita' dell'applicazione, per
# sempre. Android accetta un aggiornamento solo se e' firmato con la stessa
# chiave del pacchetto gia' installato: se la keystore si perde, non esiste
# nessuna procedura di recupero e nessun supporto da contattare. L'unica strada
# e' pubblicare un package name diverso e chiedere a ogni utente di
# disinstallare la versione precedente, perdendo i dati locali.
# Non esistendo il Play App Signing (che sul Play Store terrebbe una copia
# della chiave di firma), la copia di sicurezza e' responsabilita' nostra:
#   eas credentials -p android      # scarica la keystore
# e conservare il file .jks CON la password FUORI da EAS e fuori da questo
# repository (password manager, disco cifrato offline).
name: Android APK (sideload)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profilo EAS da compilare'
        required: true
        default: 'sideload'
        type: choice
        options:
          - sideload
          - preview
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: EAS build APK
    runs-on: ubuntu-latest
    # Serve solo quando il job pubblica una Release (softprops/action-gh-release
    # scrive con il GITHUB_TOKEN di default, che senza questo permesso e'
    # in sola lettura). Sulla build manuale (workflow_dispatch) il permesso
    # resta inutilizzato: non c'e' nessun tag da cui creare una release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      # Il runner ubuntu-latest ha 7GB di RAM totali. Con le impostazioni di
      # default il daemon Gradle e il compilatore Kotlin (KSP, usato da
      # expo-updates) si dividono poca metaspace: su un progetto con questi
      # moduli nativi (Reanimated compila C++ per piu' architetture in
      # parallelo) va in OutOfMemoryError, di solito durante la primissima
      # build senza cache. Il file utente (~/.gradle/gradle.properties) si
      # applica PRIMA di quello generato da expo prebuild dentro android/, e
      # senza modificare il codice del progetto. org.gradle.workers.max=2
      # riduce quanti task girano insieme, cosa che pesa piu' della singola
      # dimensione di heap sull'esaurire i 7GB disponibili.
      - name: Configura memoria Gradle per il runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
          EOF

      # --local compila sul runner invece che sui server EAS: non consuma la
      # coda del piano gratuito e lascia l'artefatto sul disco del runner.
      # --non-interactive e' obbligatorio in CI: senza, EAS si blocca a
      # chiedere conferma sulla keystore.
      - name: Build APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_IOS_URL_SCHEME: ${{ secrets.GOOGLE_IOS_URL_SCHEME }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile || 'sideload' }}" \
            --local \
            --non-interactive \
            --output "${{ github.workspace }}/quattro.apk"

      # L'APK e' un artefatto: si scarica dalla pagina del run e si installa
      # sul telefono. Nessuna pubblicazione automatica.
      - uses: actions/upload-artifact@v4
        with:
          name: quattro-android-apk
          path: quattro.apk
          # 90 giorni e' il massimo su repository pubblici.
          retention-days: 90
          if-no-files-found: error

      # Un artefatto di Actions richiede il login a GitHub anche su
      # repository pubblici: inutile per chi deve solo installare l'app.
      # Una Release e' anonima e ha un URL stabile che non cambia mai,
      # "releases/latest/download/quattro.apk": e' il link che usa
      # docs/index.html. Gira solo sui tag "v*", non su workflow_dispatch,
      # perche' una build manuale (es. profilo "preview") non e' una release
      # pubblica.
      - name: Pubblica la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: quattro.apk
          # generate_release_notes usa i commit dal tag precedente: comodo,
          # e non richiede di scrivere le note a mano ad ogni tag.
          generate_release_notes: true
          body: |
            APK universale Android (profilo `sideload`), non firmato dal Play
            Store: prima dell'installazione va attivato "installa da sorgenti
            sconosciute". Vedi la pagina di installazione per le istruzioni.
